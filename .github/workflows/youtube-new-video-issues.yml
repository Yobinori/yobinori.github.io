name: Create issues for new YouTube videos

on:
  schedule:
    # 09:00 JST (JST does not observe daylight saving time)
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      target_date:
        description: "Target date in JST (YYYY-MM-DD). Empty means yesterday."
        required: false
        type: string
      dry_run:
        description: "Show what would be created without creating issues."
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

concurrency:
  group: youtube-new-video-issues
  cancel-in-progress: false

jobs:
  create-issues:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        run: node --test .github/scripts/create-video-issues.test.mjs

      - name: Check YouTube and create issues
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID: ${{ vars.YOUTUBE_CHANNEL_ID }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TARGET_DATE: ${{ inputs.target_date || '' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: node .github/scripts/create-video-issues.mjs
