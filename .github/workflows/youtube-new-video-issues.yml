name: Create issues for new YouTube videos

on:
  issues:
    types: [edited]
  workflow_dispatch:
    inputs:
      target_date:
        description: "Target date in JST (YYYY-MM-DD). Empty means yesterday."
        required: false
        type: string
      start_date:
        description: "Optional first date in JST for catch-up (YYYY-MM-DD). Overrides lookback."
        required: false
        type: string
      lookback_days:
        description: "Days ending on target_date, inclusive. Manual runs overlap by 14 days."
        required: false
        default: "14"
        type: string
      dry_run:
        description: "Show what would be created without creating issues."
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

concurrency:
  group: youtube-new-video-issues
  cancel-in-progress: false

jobs:
  create-issues:
    if: >-
      github.event_name != 'issues' ||
      (github.event.issue.number == 14 && github.event.sender.id == 32870956 &&
       github.event.sender.login == 'Yobinori' && github.event.changes.body != null)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Run tests
        run: node --test .github/scripts/create-video-issues.test.mjs .github/scripts/issue-video-dispatch.test.mjs

      - name: Check YouTube and create issues
        if: github.event_name != 'issues'
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID: ${{ vars.YOUTUBE_CHANNEL_ID }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TARGET_DATE: ${{ inputs.target_date || '' }}
          START_DATE: ${{ inputs.start_date || '' }}
          LOOKBACK_DAYS: ${{ inputs.lookback_days || '1' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: node .github/scripts/create-video-issues.mjs

      - name: Validate and process dedicated issue request
        if: github.event_name == 'issues'
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID: ${{ vars.YOUTUBE_CHANNEL_ID }}
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/issue-video-dispatch.mjs
